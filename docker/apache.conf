<Directory /var/www/html>
    Options -Indexes
    AllowOverride None
    Require all granted
</Directory>

# Folder dan file internal tidak boleh dibuka lewat browser
<DirectoryMatch "^/var/www/html/(includes|docker)">
    Require all denied
</DirectoryMatch>
<FilesMatch "^(config\..*|database\.rules\.json|Dockerfile|render\.yaml|.*\.md)$">
    Require all denied
</FilesMatch>

ServerTokens Prod
ServerSignature Off
